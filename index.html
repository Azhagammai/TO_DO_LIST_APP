<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧾TO_DO_LIST🧾</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="login-section" class="form-container">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Login</button>
                <p id="register-link">Don't have an account? <a href="#" onclick="showRegister()">Register</a></p>
                <p id="login-error" class="error-message"></p>
            </form>
        </div>

        <!-- Registration Form -->
        <div id="register-section" class="form-container" style="display: none;">
            <h2>Register</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="new-username">Username:</label>
                    <input type="text" id="new-username" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Password:</label>
                    <input type="password" id="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password" required>
                </div>
                <button type="submit">Register</button>
                <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
                <p id="register-error" class="error-message"></p>
            </form>
        </div>

        <!-- CRUD Dashboard (shown after login) -->
        <div id="dashboard" style="display: none;">
            <h2>Welcome, <span id="logged-in-user"></span>!</h2>
            <button onclick="logout()" class="logout-btn">Logout</button>
            
            <div class="crud-section">
                <h3>TASK_MANAGEMENT</h3>
                <form id="item-form">
                    <input type="hidden" id="item-id">
                    <div class="form-group">
                        <label for="item-name">TASKS:</label>
                        <input type="text" id="item-name" required>
                    </div>
                    <div class="form-group">
                        <label for="item-description">Description:</label>
                        <textarea id="item-description" required></textarea>
                    </div>
                    <button type="submit" id="save-btn">Add Task</button>
                </form>
                
                <div class="items-list">
                    <h4>YOUR_ASK</h4>
                    <table id="items-table">
                        <thead>
                            <tr>
                                <th>S.No🧐</th>
                                <th>TASKS🧾</th>
                                <th>COMPLETED🎉</th>
                            </tr>
                        </thead>
                        <tbody id="items-tbody">
                            <!-- Items will be added here dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
